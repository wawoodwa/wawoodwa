<title>Dot Link</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen portrait app. Header (level, total length, star target, best chip), full-bleed canvas, footer controls. */
:root {
  --bg: #e8ecf0; --board: #f8fafc; --grid: #d9e0e7; --wall: #5d6b7a; --ghost: #d23b3b;
  --c0: #e0413a; --c1: #2f6fe0; --c2: #1c9a5a; --c3: #e0a000; --c4: #8a4fd6; --c5: #ee7a1a;
  --accent: #2f6fe0; --gold: #d99a00;
  --text: #17202a; --muted: #5a6878; --panel: #ffffff; --line: #c7d2dc;
  --good: #1c8547; --bad: #c22f2f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --board: #1a222d; --grid: #2a3442; --wall: #8697ab; --ghost: #ff6060;
    --c0: #ff6a5c; --c1: #5f97ff; --c2: #3ccf86; --c3: #ffc93d; --c4: #b48cff; --c5: #ff9b4a;
    --accent: #5f97ff; --gold: #ffc93d;
    --text: #e9f1f9; --muted: #9db2ca; --panel: #1d2531; --line: #34404f;
    --good: #6fe0a0; --bad: #ff8080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --board: #1a222d; --grid: #2a3442; --wall: #8697ab; --ghost: #ff6060;
  --c0: #ff6a5c; --c1: #5f97ff; --c2: #3ccf86; --c3: #ffc93d; --c4: #b48cff; --c5: #ff9b4a;
  --accent: #5f97ff; --gold: #ffc93d;
  --text: #e9f1f9; --muted: #9db2ca; --panel: #1d2531; --line: #34404f;
  --good: #6fe0a0; --bad: #ff8080;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--text); font-family: var(--sans);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 12px; background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
header.bar { justify-content: space-between; border-bottom: 1.5px solid var(--line); }
footer.bar { border-top: 1.5px solid var(--line); gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.lvl-id { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { white-space: nowrap; font: 600 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lvl-name { font: 20px/1.15 var(--display); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.len-read { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.len-read span { color: var(--muted); font-weight: 400; }
.best-chip {
  font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent);
  background: transparent; border: 1.5px solid var(--accent); border-radius: 999px;
  padding: 6px 10px; margin-top: 2px; cursor: pointer; white-space: nowrap;
}
.best-chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.best-chip:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
#stage { flex: 1; position: relative; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px); text-align: center; white-space: nowrap;
  font: 14px/1.3 var(--display); color: var(--accent); pointer-events: none;
  background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 12px; border-radius: 8px;
}
.btn {
  font: 600 15px/1 var(--sans); min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
footer .grow { flex: 1; }
.card {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  margin-inline: auto; max-width: 380px;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); pointer-events: none;
}
.card h2 { margin: 0; font: 24px/1.15 var(--display); font-weight: 400; text-wrap: balance; color: var(--good); }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.card p.tip { font-size: 13px; }
.stars { font: 26px/1 var(--sans); letter-spacing: .15em; color: var(--gold); }
.stars .off { color: var(--line); }
.sheet {
  position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 94%, transparent);
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px;
}
.sheet h2 { margin: 0; font: 22px/1.1 var(--display); font-weight: 400; color: var(--accent); }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lvl {
  text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text);
  font: inherit; cursor: pointer; min-width: 0;
}
.lvl.current { border-color: var(--accent); }
.lvl b { font: 15px/1.15 var(--display); color: var(--accent); font-weight: 400; overflow-wrap: anywhere; }
.lvl small { font: 12px/1.2 var(--mono); color: var(--muted); }
.lvl .stars { font-size: 16px; }
</style>

<div id="app">
  <header class="bar">
    <div class="lvl-id">
      <div class="eyebrow" id="lvlNo">Level 01 · 1 pair</div>
      <div class="lvl-name" id="lvlName">Single Link</div>
    </div>
    <div class="stats" aria-live="polite">
      <div class="len-read" id="lenRead">0 <span>/ 3★ 0</span></div>
      <button class="best-chip" id="bestBtn" disabled>No best yet</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="Puzzle board. Draw a line from each dot to the dot of the same colour."></canvas>
    <div class="hint" id="hint">Draw from a dot to its match</div>
    <div class="card" id="card" hidden>
      <h2 id="cardTitle">All linked</h2>
      <div class="stars" id="cardStars"></div>
      <p id="cardText"></p>
      <p class="tip">Tap the board to hide or show this.</p>
    </div>
    <div class="sheet" id="sheet" hidden>
      <h2>Choose a level</h2>
      <div class="levels" id="levelList"></div>
      <button class="btn" id="sheetClose">Back</button>
    </div>
  </div>
  <footer class="bar">
    <button class="btn" id="btnLevels">Levels</button>
    <div class="grow"></div>
    <button class="btn" id="btnReplay" disabled>Replay</button>
    <button class="btn" id="btnRetry">Retry</button>
    <button class="btn primary" id="btnNext">Next</button>
  </footer>
</div>

<script>
(() => {
// World: the board is W x H units, scaled to fit the stage and centred. Lines are polylines of [x, y] points.
const W = 360, H = 600;
const DOT_R = 13;              // dot radius
const LINE_W = 7;              // drawn line width
const GAP = 12;                // two lines' centres stay at least this far apart
const DOT_CLEAR = DOT_R + 8;   // a line stays this far from the centre of every other colour's dot
const WALL_CLEAR = 6;          // ... this far from walls and posts
const EDGE = 7;                // ... and this far inside the board edge
const STEP = 6;                // the finger's path is sampled at most this far apart
const SNAP = DOT_R + 9;        // reaching this close to the matching dot completes the line
const SMOOTH = 3;              // a finished line drops wobbles smaller than this
const PICK = DOT_R + 14;       // touch radius for grabbing a dot
const UNDO_BACK = 16;          // dragging back over your own line this far behind the tip rubs it out
const REPLAY_V = 700;          // replay drawing speed, units per second
const COLORS = ['c0', 'c1', 'c2', 'c3', 'c4', 'c5'];

// pairs: [ax, ay, bx, by] per colour. walls: [x, y, w, h] rectangles. posts: [x, y, r] round posts.
// Stars: total line length. `three` / `two` are the thresholds (shorter is better); any finished board is 1 star.
const LEVELS = [
  { name: 'Single Link', three: 345, two: 420, pairs: [[180, 150, 180, 450]] },
  { name: 'Side by Side', three: 736, two: 896, pairs: [[100, 140, 100, 460], [260, 140, 260, 460]] },
  { name: 'Crossed Pairs', three: 875, two: 1065, pairs: [[90, 180, 270, 420], [270, 180, 90, 420]] },
  { name: 'Center Wall', three: 1038, two: 1263, pairs: [[120, 150, 240, 450], [240, 150, 120, 450]],
    walls: [[60, 280, 240, 40]] },
  { name: 'Three Crossings', three: 1777, two: 2163, pairs: [[70, 140, 290, 460], [290, 140, 70, 460], [180, 90, 180, 510]] },
  { name: 'Narrow Gate', three: 1678, two: 2043, pairs: [[60, 150, 300, 450], [180, 130, 180, 470], [300, 150, 60, 450]],
    walls: [[0, 285, 166, 30], [200, 285, 130, 30]] },
  { name: 'Corridor Run', three: 2022, two: 2462, pairs: [[50, 90, 60, 530], [310, 90, 300, 530]],
    walls: [[0, 170, 270, 20], [90, 300, 270, 20], [0, 430, 270, 20]] },
  { name: 'Four Corners', three: 2389, two: 2909, pairs: [[45, 55, 315, 545], [315, 55, 45, 545], [180, 170, 180, 430], [55, 300, 305, 300]] },
  { name: 'Boxed In', three: 1420, two: 1729, pairs: [[180, 305, 180, 530], [40, 300, 320, 300], [180, 90, 330, 540]],
    walls: [[125, 250, 12, 110], [223, 250, 12, 110], [125, 348, 110, 12]] },
  { name: 'Swap Sides', three: 2133, two: 2597, pairs: [[60, 120, 300, 480], [60, 240, 300, 360], [60, 360, 300, 240], [60, 480, 300, 120]] },
  { name: 'Blocked Routes', three: 2527, two: 3077, pairs: [[40, 120, 320, 480], [320, 120, 40, 480], [180, 110, 180, 490], [40, 300, 320, 300]],
    posts: [[120, 200, 22], [240, 200, 22], [180, 300, 22], [120, 400, 22], [240, 400, 22]] },
  { name: 'Six Colors', three: 3509, two: 4272, pairs: [[50, 80, 310, 520], [310, 80, 50, 520], [180, 80, 180, 520], [50, 300, 310, 300], [110, 190, 250, 410], [250, 190, 110, 410]] },
];

// ---------- geometry ----------
const hyp = (x, y) => Math.sqrt(x * x + y * y);
const dist = (a, b) => hyp(a[0] - b[0], a[1] - b[1]);
function ptSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  let t = l ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hyp(a[0] + t * dx - p[0], a[1] + t * dy - p[1]);
}
const orient = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
function segsCross(a, b, c, d) {
  const o1 = orient(a, b, c), o2 = orient(a, b, d), o3 = orient(c, d, a), o4 = orient(c, d, b);
  return ((o1 > 0 && o2 < 0) || (o1 < 0 && o2 > 0)) && ((o3 > 0 && o4 < 0) || (o3 < 0 && o4 > 0));
}
function segSeg(a, b, c, d) {
  if (segsCross(a, b, c, d)) return 0;
  return Math.min(ptSeg(a, c, d), ptSeg(b, c, d), ptSeg(c, a, b), ptSeg(d, a, b));
}
function ptRect(p, r) {
  const dx = Math.max(r[0] - p[0], 0, p[0] - r[0] - r[2]), dy = Math.max(r[1] - p[1], 0, p[1] - r[1] - r[3]);
  return hyp(dx, dy);
}
function segRect(a, b, r) {
  // Liang-Barsky clip: does the segment enter the rectangle at all?
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let t0 = 0, t1 = 1, hit = true;
  for (const [p, q] of [[-dx, a[0] - r[0]], [dx, r[0] + r[2] - a[0]], [-dy, a[1] - r[1]], [dy, r[1] + r[3] - a[1]]]) {
    if (p === 0) { if (q < 0) { hit = false; break; } }
    else { const t = q / p; if (p < 0) { if (t > t1) { hit = false; break; } if (t > t0) t0 = t; } else { if (t < t0) { hit = false; break; } if (t < t1) t1 = t; } }
  }
  if (hit) return 0;
  const cs = [[r[0], r[1]], [r[0] + r[2], r[1]], [r[0], r[1] + r[3]], [r[0] + r[2], r[1] + r[3]]];
  return Math.min(ptRect(a, r), ptRect(b, r), ...cs.map(c => ptSeg(c, a, b)));
}
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]); return s; }

// ---------- rules ----------
let li = 0, lv = LEVELS[0];
const dotsOf = l => l.pairs.map(q => [[q[0], q[1]], [q[2], q[3]]]);
// What blocks the segment a-b for colour pi? Returns null when it's clear. `lines` holds every other colour's line
// (index = colour); `own` is the line being drawn, whose last segment ends at a. m adds extra clearance (the solver uses it).
function blocker(a, b, pi, lines, own, m = 0, level = lv) {
  const e = EDGE + m;
  for (const p of [a, b]) if (p[0] < e || p[0] > W - e || p[1] < e || p[1] > H - e) return 'edge';
  const pairs = level.pairs;
  for (let j = 0; j < pairs.length; j++) {
    if (j === pi) continue;
    const q = pairs[j];
    if (ptSeg([q[0], q[1]], a, b) < DOT_CLEAR + m || ptSeg([q[2], q[3]], a, b) < DOT_CLEAR + m) return 'dot';
  }
  for (const r of level.walls || []) if (segRect(a, b, r) < WALL_CLEAR + m) return 'wall';
  for (const c of level.posts || []) if (ptSeg(c, a, b) < c[2] + WALL_CLEAR + m) return 'wall';
  for (let j = 0; j < lines.length; j++) {
    const L = lines[j];
    if (!L || j === pi) continue;
    const pts = L.pts || L;
    for (let k = 1; k < pts.length; k++) if (segSeg(a, b, pts[k - 1], pts[k]) < GAP + m) return 'line';
  }
  if (own) for (let k = 1; k < own.length - 1; k++) if (segsCross(a, b, own[k - 1], own[k])) return 'self';
  return null;
}
// Drop wobbles: Ramer-Douglas-Peucker, but only keep a shortcut that is itself clear.
function smooth(pts, pi, lines, m = 0, eps = SMOOTH) {
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [i, j] = stack.pop();
    if (j - i < 2) continue;
    let far = -1, fd = -1;
    for (let k = i + 1; k < j; k++) { const d = ptSeg(pts[k], pts[i], pts[j]); if (d > fd) { fd = d; far = k; } }
    if (fd <= eps && !blocker(pts[i], pts[j], pi, lines, null, m)) continue;
    keep[far] = 1; stack.push([i, far], [far, j]);
  }
  return pts.filter((_, k) => keep[k]);
}

// ---------- state ----------
let lines = [];         // lines[colour] = { pts, seq } for each finished line
let active = null;      // the line being drawn: { p, to: [x, y], pts }
let ghost = null;       // [from, to] when the finger is somewhere the line can't go
let seq = 0, state = 'play';   // 'play' | 'won' | 'replay'
let stroke = null;      // current pointer: { id, kind: 'draw' | 'tap', p, x, y, moved }
let replay = null;

const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let best = {}, runs = {};
const BEST_KEY = 'dot-link-best', RUNS_KEY = 'dot-link-runs-v1', LEVEL_KEY = 'dot-link-level';
try { best = JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; } catch (e) { best = {}; }
try { runs = JSON.parse(localStorage.getItem(RUNS_KEY) || '{}') || {}; } catch (e) { runs = {}; }
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
function saveRuns() { try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs)); } catch (e) {} }
let startLevel = 0;
try { startLevel = Math.min(Math.max(+localStorage.getItem(LEVEL_KEY) || 0, 0), LEVELS.length - 1); } catch (e) {}

const totalLen = () => lines.reduce((s, L) => s + (L ? polyLen(L.pts) : 0), 0) + (active ? polyLen(active.pts) : 0);
const starsFor = (len, l = lv) => len <= l.three ? 3 : len <= l.two ? 2 : 1;
const starStr = n => '★'.repeat(n) + '<span class="off">' + '★'.repeat(3 - n) + '</span>';

function load(i) {
  stopReplay(true);
  li = i; lv = LEVELS[i];
  lines = []; active = null; ghost = null; stroke = null; seq = 0; state = 'play';
  try { localStorage.setItem(LEVEL_KEY, i); } catch (e) {}
  $('lvlNo').textContent = `Level ${String(i + 1).padStart(2, '0')} · ${lv.pairs.length} ${lv.pairs.length > 1 ? 'pairs' : 'pair'}`;
  $('lvlName').textContent = lv.name;
  $('card').hidden = true;
  $('hint').hidden = i > 0 && !!runs[lv.name];
  $('btnNext').disabled = i >= LEVELS.length - 1;
  refresh(); dirty = true;
}
function refresh() {
  const b = best[lv.name], r = runs[lv.name];
  const len = replay ? replay.shown : totalLen();
  $('lenRead').innerHTML = `${Math.round(len)} <span>/ 3★ ${lv.three}</span>`;
  const chip = $('bestBtn');
  chip.disabled = !b;
  chip.textContent = b ? `Best ${Math.round(b.len)} ${'★'.repeat(starsFor(b.len))}` : 'No best yet';
  $('btnReplay').disabled = !r;
}

// ---------- drawing input ----------
function startLine(p, end) {
  delete lines[p];
  const q = lv.pairs[p];
  const from = end ? [q[2], q[3]] : [q[0], q[1]], to = end ? [q[0], q[1]] : [q[2], q[3]];
  active = { p, to, pts: [from] }; ghost = null;
}
function extend(t) {
  const a = active, pts = a.pts;
  // Dragging back over the line rubs it out back to that point.
  let arc = 0;
  for (let i = pts.length - 2; i >= 0; i--) {
    arc += dist(pts[i], pts[i + 1]);
    if (arc >= UNDO_BACK && dist(pts[i], t) < 9) { pts.length = i + 1; ghost = null; return; }
  }
  let prev = pts[pts.length - 1];
  const d = dist(prev, t);
  if (d < 3) return;
  const n = Math.ceil(d / STEP), from = prev;
  for (let k = 1; k <= n; k++) {
    const s = [from[0] + (t[0] - from[0]) * k / n, from[1] + (t[1] - from[1]) * k / n];
    if (blocker(prev, s, a.p, lines, pts)) { ghost = [prev, t]; return; }
    pts.push(s); prev = s; ghost = null;
    if (dist(s, a.to) <= SNAP && !blocker(s, a.to, a.p, lines, pts)) { pts.push(a.to); finishLine(); return; }
  }
}
function finishLine() {
  const a = active;
  lines[a.p] = { pts: smooth(a.pts, a.p, lines).map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]), seq: ++seq };
  active = null; ghost = null;
  if (lv.pairs.every((_, j) => lines[j])) win();
}
function win() {
  state = 'won';
  const len = totalLen();
  const run = { len, lines: lines.map((L, p) => ({ p, seq: L.seq, pts: L.pts })).sort((x, y) => x.seq - y.seq).map(({ p, pts }) => ({ p, pts })) };
  runs[lv.name] = run; saveRuns();
  const prev = best[lv.name], isBest = !prev || len < prev.len - 0.05;
  if (isBest) { best[lv.name] = run; saveBest(); }
  const st = starsFor(len), L = Math.round(len);
  $('cardTitle').textContent = 'All linked';
  $('cardStars').innerHTML = starStr(st);
  $('cardText').textContent = st === 3 ? `Great job! Total length ${L}.`
    : `Total length ${L}. Get it to ${lv.three} or less for 3 stars.` + (isBest && prev ? ' New best.' : '');
  $('card').hidden = false;
  refresh();
}
function lineNear(w) {
  let bp = -1, bd = 12;
  lines.forEach((L, p) => { if (!L) return; for (let k = 1; k < L.pts.length; k++) { const d = ptSeg(w, L.pts[k - 1], L.pts[k]); if (d < bd) { bd = d; bp = p; } } });
  return bp;
}
function dotNear(w) {
  let best = null, bd = PICK;
  lv.pairs.forEach((q, p) => [[q[0], q[1]], [q[2], q[3]]].forEach((d, end) => { const dd = dist(d, w); if (dd < bd) { bd = dd; best = { p, end }; } }));
  return best;
}
canvas.addEventListener('pointerdown', e => {
  if (stroke) return;
  if (state === 'replay') { stopReplay(); return; }
  if (state === 'won') { $('card').hidden = !$('card').hidden; return; }
  const w = toWorld(e);
  $('hint').hidden = true;
  const d = dotNear(w);
  if (d) { startLine(d.p, d.end); stroke = { id: e.pointerId, kind: 'draw' }; }
  else stroke = { id: e.pointerId, kind: 'tap', p: lineNear(w), x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  refresh(); dirty = true;
});
canvas.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  if (stroke.kind === 'tap') { if (hyp(e.clientX - stroke.x, e.clientY - stroke.y) > 10) stroke.p = -1; return; }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) { if (!active) break; extend(toWorld(ev)); }
  refresh(); dirty = true;
});
function endStroke(e) {
  if (!stroke || e.pointerId !== stroke.id) return;
  if (stroke.kind === 'tap' && stroke.p >= 0) delete lines[stroke.p];   // tapping a line removes it
  active = null; ghost = null; stroke = null;   // a line let go before its match is dropped
  refresh(); dirty = true;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

// ---------- replay ----------
function startReplay(run) {
  if (!run) return;
  stopReplay(true);
  replay = { run, t0: performance.now(), shown: 0, saved: { state, card: $('card').hidden } };
  state = 'replay'; active = null; ghost = null; stroke = null;
  $('card').hidden = true; $('hint').hidden = true;
  dirty = true;
}
function stopReplay(quiet) {
  if (!replay) return;
  state = replay.saved.state; $('card').hidden = replay.saved.card;
  replay = null;
  if (!quiet) { refresh(); dirty = true; }
}

// ---------- render ----------
let sc = 1, ox = 0, oy = 0, cw = 0, ch = 0, dpr = 1, dirty = true;
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc];
}
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const pad = 10;
  sc = Math.max(0.1, Math.min((cw - 2 * pad) / W, (ch - 2 * pad) / H));
  ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;
  dirty = true;
}
new ResizeObserver(resize).observe(canvas);
function css() {
  const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue('--' + n).trim();
  return { bg: v('bg'), board: v('board'), grid: v('grid'), wall: v('wall'), ghost: v('ghost'), line: v('line'), cols: COLORS.map(v) };
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function path(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); }
function draw() {
  const C = css();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  rrect(0, 0, W, H, 14); ctx.fillStyle = C.board; ctx.fill();
  ctx.lineWidth = 1.5 / sc; ctx.strokeStyle = C.line; ctx.stroke();
  ctx.fillStyle = C.grid;
  for (let x = 30; x < W; x += 30) for (let y = 30; y < H; y += 30) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = C.wall;
  for (const r of lv.walls || []) { rrect(r[0], r[1], r[2], r[3], 3); ctx.fill(); }
  for (const c of lv.posts || []) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 7); ctx.fill(); }

  // lines
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = LINE_W;
  let shown = lines.map((L, p) => L && { p, pts: L.pts });
  if (replay) {
    shown = []; let left = (performance.now() - replay.t0) / 1000 * REPLAY_V, total = 0;
    for (const { p, pts } of replay.run.lines) {
      const part = [pts[0]];
      for (let i = 1; i < pts.length && left > 0; i++) {
        const d = dist(pts[i - 1], pts[i]);
        if (d <= left) { part.push(pts[i]); left -= d; total += d; }
        else { const f = left / d; part.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]); total += left; left = 0; }
      }
      shown[p] = { p, pts: part, done: part.length === pts.length && left >= 0 };
      if (left <= 0) break;
    }
    replay.shown = total;
    if (left > 0) { replay.doneAt = replay.doneAt || performance.now(); if (performance.now() - replay.doneAt > 900) { stopReplay(); return draw(); } }
  }
  for (const L of shown) if (L && L.pts.length > 1) { ctx.strokeStyle = C.cols[L.p]; path(L.pts); ctx.stroke(); }
  if (active && active.pts.length > 1) { ctx.strokeStyle = C.cols[active.p]; path(active.pts); ctx.stroke(); }
  if (ghost) {
    ctx.save(); ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.strokeStyle = C.ghost; path(ghost); ctx.stroke(); ctx.restore();
  }

  // dots: a hollow centre until the pair is linked
  lv.pairs.forEach((q, p) => {
    const linked = replay ? !!(shown[p] && shown[p].done) : !!lines[p];
    for (const d of [[q[0], q[1]], [q[2], q[3]]]) {
      ctx.fillStyle = C.cols[p];
      ctx.beginPath(); ctx.arc(d[0], d[1], DOT_R, 0, 7); ctx.fill();
      if (!linked) { ctx.fillStyle = C.board; ctx.beginPath(); ctx.arc(d[0], d[1], 5, 0, 7); ctx.fill(); }
    }
    if (active && active.p === p) {
      ctx.strokeStyle = C.cols[p]; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(active.to[0], active.to[1], DOT_R + 6, 0, 7); ctx.stroke();
      ctx.lineWidth = LINE_W;
    }
  });
}
function frame() {
  if (replay) { draw(); refresh(); }
  else if (dirty) { dirty = false; draw(); }
  requestAnimationFrame(frame);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { dirty = true; });
new MutationObserver(() => { dirty = true; }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- controls ----------
$('btnRetry').onclick = () => load(li);
$('btnNext').onclick = () => { if (li < LEVELS.length - 1) load(li + 1); };
$('btnReplay').onclick = () => startReplay(runs[lv.name]);
$('bestBtn').onclick = () => startReplay(best[lv.name]);
function openLevels() {
  stopReplay();
  const list = $('levelList'); list.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button'), bs = best[l.name];
    b.className = 'lvl' + (i === li ? ' current' : '');
    b.innerHTML = `<small>${String(i + 1).padStart(2, '0')} · ${l.pairs.length} ${l.pairs.length > 1 ? 'pairs' : 'pair'}</small><b></b>` +
      `<div class="stars">${starStr(bs ? starsFor(bs.len, l) : 0)}</div><small>${bs ? 'Best ' + Math.round(bs.len) : 'Not linked yet'}</small>`;
    b.querySelector('b').textContent = l.name;
    b.onclick = () => { $('sheet').hidden = true; load(i); };
    list.appendChild(b);
  });
  $('sheet').hidden = false;
  const cur = list.children[li]; if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
}
$('btnLevels').onclick = openLevels;
$('sheetClose').onclick = () => { $('sheet').hidden = true; };

// For the solver and the headless playtester.
window.__game = {
  W, H, LEVELS, GAP, DOT_CLEAR, WALL_CLEAR, EDGE, blocker, smooth, polyLen,
  load, get li() { return li; }, get state() { return state; }, get lines() { return lines; }, totalLen,
  toClient(x, y) { const r = canvas.getBoundingClientRect(); return [r.left + ox + x * sc, r.top + oy + y * sc]; },
};

resize();
load(startLevel);
requestAnimationFrame(frame);
})();
</script>
