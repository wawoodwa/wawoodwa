<style>
/* Layout: one-screen portrait app. Header (span name + steel meter), full-bleed drafting-paper canvas, footer controls. */
:root {
  --paper: #f2f5f7; --grid: #dbe4eb; --grid-major: #bfcdd8;
  --ink: #1f45a6; --rock: #3e4651; --rock-fill: #dde2e6;
  --car: #d2402a; --flag: #d99a00; --text: #17202a; --muted: #5a6878;
  --panel: #ffffff; --line: #c7d2dc; --bad: #c22f2f; --good: #1c8547;
  --display: "Architects Daughter", "Comic Sans MS", cursive;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e2a4b; --grid: #19395f; --grid-major: #285080;
    --ink: #f3f7fc; --rock: #a9c1dd; --rock-fill: #14365c;
    --car: #ff7b5c; --flag: #ffc93d; --text: #e9f1f9; --muted: #9db2ca;
    --panel: #123358; --line: #2b5683; --bad: #ff8080; --good: #6fe0a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e2a4b; --grid: #19395f; --grid-major: #285080;
  --ink: #f3f7fc; --rock: #a9c1dd; --rock-fill: #14365c;
  --car: #ff7b5c; --flag: #ffc93d; --text: #e9f1f9; --muted: #9db2ca;
  --panel: #123358; --line: #2b5683; --bad: #ff8080; --good: #6fe0a0;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--paper); color: var(--text); font-family: var(--sans);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
header.bar { justify-content: space-between; border-bottom: 1.5px solid var(--line); }
footer.bar { border-top: 1.5px solid var(--line); }
.span-id { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { white-space: nowrap; font: 600 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.span-name { font: 24px/1.1 var(--display); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steel { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.steel-read { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.steel-read span { color: var(--muted); font-weight: 400; }
.meter { width: 112px; height: 8px; border: 1.5px solid var(--ink); border-radius: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; background: var(--ink); transition: width .08s linear; }
.meter.full i { background: var(--bad); }
.best-chip {
  font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink);
  background: transparent; border: 1.5px solid var(--ink); border-radius: 999px;
  padding: 6px 10px; margin-top: 2px; cursor: pointer;
}
.best-chip:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
.best-chip:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
#stage { flex: 1; position: relative; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px); text-align: center;
  font: 18px/1.3 var(--display); color: var(--ink); pointer-events: none;
  background: color-mix(in srgb, var(--paper) 85%, transparent); padding: 4px 12px; border-radius: 8px;
}
.btn {
  font: 600 15px/1 var(--sans); min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
footer .grow { flex: 1; }
footer.bar { gap: 8px; }
footer .btn { padding: 0 12px; }
.card {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  margin-inline: auto; max-width: 380px;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.card h2 { margin: 0; font: 28px/1.1 var(--display); text-wrap: balance; }
.card h2.win { color: var(--good); } .card h2.lose { color: var(--bad); }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.stars { font: 26px/1 var(--sans); letter-spacing: .15em; color: var(--flag); }
.stars .off { color: var(--line); }
.sheet {
  position: absolute; inset: 0; background: color-mix(in srgb, var(--paper) 92%, transparent);
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px;
}
.sheet h2 { margin: 0; font: 26px/1.1 var(--display); color: var(--ink); }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lvl {
  text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text);
  font: inherit; cursor: pointer; min-width: 0;
}
.lvl.current { border-color: var(--ink); }
.lvl b { font: 20px/1.1 var(--display); color: var(--ink); font-weight: 400; }
.lvl small { font: 12px/1.2 var(--mono); color: var(--muted); }
.lvl .stars { font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

<div id="app">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite, Constraint, Vertices, Query } = Matter;

// World units: 20 units = 1 metre. View window shown on screen:
const VIEW = { x: 0, y: 120, w: 400, h: 640 };
const UNIT = 20, STEP = 1000 / 60, T = 6;            // T = bridge thickness
const WHEEL_R = 11, MOTOR = 0.22, MOTOR_DELAY = 900;

// Each span: cliff edges (x = cliff lip, y = top), steel allowance (units), extra outcrops (convex polygons).
const LEVELS = [
  { name: 'Dry Creek', L: { x: 130, y: 400 }, R: { x: 270, y: 400 }, ink: 266, rocks: [] },
  { name: 'Twin Ledges', L: { x: 100, y: 390 }, R: { x: 300, y: 390 }, ink: 366, rocks: [
      [[90,450],[150,455],[146,468],[90,490]],
      [[310,450],[250,455],[254,468],[310,490]] ] },
  { name: 'The Needle', L: { x: 80, y: 380 }, R: { x: 320, y: 380 }, ink: 434, rocks: [
      [[184,452],[216,452],[232,1600],[168,1600]] ] },
  { name: 'Step Down', L: { x: 110, y: 320 }, R: { x: 290, y: 450 }, ink: 404, rocks: [
      [[100,400],[165,408],[160,421],[100,440]] ] },
  { name: 'Uphill Haul', L: { x: 120, y: 460 }, R: { x: 290, y: 385 }, ink: 344, rocks: [
      [[300,432],[240,440],[245,452],[300,472]] ] },
  { name: 'Wide Canyon', L: { x: 90, y: 360 }, R: { x: 340, y: 360 }, ink: 450, rocks: [
      [[134,442],[158,442],[170,1600],[122,1600]],
      [[244,428],[268,428],[280,1600],[232,1600]] ] },
  { name: 'Low Ceiling', L: { x: 110, y: 400 }, R: { x: 290, y: 400 }, ink: 334, rocks: [
      [[140,296],[260,296],[244,350],[156,350]] ] },
  { name: 'Long Drop', L: { x: 100, y: 330 }, R: { x: 300, y: 450 }, ink: 422, rocks: [
      [[188,410],[212,410],[226,1600],[174,1600]] ] },
  { name: 'Boulder in the Way', L: { x: 90, y: 390 }, R: { x: 310, y: 390 }, ink: 400, rocks: [
      boulder(200, 385, 22) ] },
  { name: 'Shelf Climb', L: { x: 100, y: 420 }, R: { x: 300, y: 350 }, ink: 386, rocks: [
      [[240,350],[300,350],[300,378],[252,366]] ] },
  { name: 'Stepping Stones', L: { x: 90, y: 350 }, R: { x: 330, y: 350 }, ink: 434, rocks: [
      boulder(150, 412, 16), boulder(250, 412, 16) ] },
  { name: 'Grand Gorge', L: { x: 90, y: 330 }, R: { x: 340, y: 420 }, ink: 476, rocks: [
      boulder(205, 372, 24), [[140,444],[164,444],[176,1600],[128,1600]] ] },
  { name: 'Keyhole', L: { x: 100, y: 380 }, R: { x: 300, y: 410 }, ink: 370, rocks: [
      [[150,300],[250,300],[240,346],[160,346]], boulder(200, 450, 16) ] },
  { name: 'Big Step Up', L: { x: 110, y: 470 }, R: { x: 290, y: 390 }, ink: 362, rocks: [
      [[295,430],[250,440],[255,452],[295,470]] ] },
  { name: 'Pinball', L: { x: 90, y: 360 }, R: { x: 310, y: 420 }, ink: 414, rocks: [
      boulder(170, 430, 14), boulder(240, 395, 14) ] },
  { name: 'The Funnel', L: { x: 90, y: 350 }, R: { x: 310, y: 350 }, ink: 400, rocks: [
      [[85,400],[175,450],[170,462],[85,430]], [[315,400],[225,450],[230,462],[315,430]] ] },
  { name: 'Downhill Slalom', L: { x: 90, y: 300 }, R: { x: 320, y: 450 }, ink: 490, rocks: [
      boulder(160, 365, 14), boulder(245, 418, 14) ] },
  { name: 'Hanging Rock', L: { x: 90, y: 340 }, R: { x: 340, y: 380 }, ink: 456, rocks: [
      [[150,250],[250,250],[244,316],[156,316]], boulder(205, 420, 16) ] },
  { name: "Needle's Eye", L: { x: 100, y: 370 }, R: { x: 300, y: 370 }, ink: 366, rocks: [
      [[160,240],[240,240],[232,330],[168,330]], [[186,420],[214,420],[226,1600],[174,1600]] ] },
  { name: 'Tight Budget', L: { x: 90, y: 360 }, R: { x: 340, y: 360 }, ink: 450, rocks: [] },
  { name: 'Three Pebbles', L: { x: 90, y: 380 }, R: { x: 310, y: 380 }, ink: 400, rocks: [
      boulder(150, 412, 10), boulder(200, 404, 10), boulder(250, 412, 10) ] },
  { name: 'Low Bridge', L: { x: 100, y: 380 }, R: { x: 300, y: 380 }, ink: 366, rocks: [
      [[262,280],[340,280],[340,330],[270,330]] ] },
  { name: 'Pillar Stairs', L: { x: 100, y: 450 }, R: { x: 300, y: 380 }, ink: 386, rocks: [
      [[150,476],[170,476],[180,1600],[140,1600]], [[230,430],[250,430],[262,1600],[218,1600]] ] },
  { name: 'Zigzag', L: { x: 90, y: 330 }, R: { x: 320, y: 330 }, ink: 416, rocks: [
      boulder(155, 302, 13), boulder(255, 360, 14) ] },
  { name: 'Roofed Climb', L: { x: 90, y: 400 }, R: { x: 340, y: 340 }, ink: 462, rocks: [
      [[190,240],[250,240],[244,330],[196,330]], boulder(170, 450, 16) ] },
  { name: 'Underpass', L: { x: 100, y: 360 }, R: { x: 300, y: 360 }, ink: 366, rocks: [
      [[170,250],[230,250],[226,338],[174,338]], boulder(200, 346, 10) ] },
  { name: 'Ski Run', L: { x: 90, y: 300 }, R: { x: 320, y: 420 }, ink: 466, rocks: [
      boulder(180, 370, 14) ] },
  { name: 'Double Arch', L: { x: 90, y: 380 }, R: { x: 310, y: 380 }, ink: 400, rocks: [
      [[125,260],[175,260],[170,340],[130,340]], [[225,260],[275,260],[270,340],[230,340]],
      [[190,410],[210,410],[220,1600],[180,1600]] ] },
  { name: 'The Spire', L: { x: 100, y: 420 }, R: { x: 300, y: 420 }, ink: 366, rocks: [
      [[190,400],[210,400],[222,1600],[178,1600]] ] },
  { name: 'Rocky Descent', L: { x: 90, y: 340 }, R: { x: 350, y: 400 }, ink: 478, rocks: [
      [[150,240],[220,240],[215,316],[155,316]], boulder(240, 430, 14), [[140,440],[160,440],[170,1600],[130,1600]] ] },
  { name: 'Twin Spires', L: { x: 100, y: 400 }, R: { x: 300, y: 400 }, ink: 366, rocks: [
      [[152,388],[168,388],[176,1600],[144,1600]], [[232,388],[248,388],[256,1600],[224,1600]] ] },
  { name: 'Stone Arch', L: { x: 100, y: 390 }, R: { x: 300, y: 390 }, ink: 366, rocks: [
      [[110,300],[290,300],[285,338],[115,338]] ] },
  { name: 'Terrace Drop', L: { x: 90, y: 320 }, R: { x: 330, y: 420 }, ink: 466, rocks: [
      [[175,366],[235,366],[231,380],[179,380]] ] },
  { name: 'Pillar Forest', L: { x: 90, y: 380 }, R: { x: 330, y: 380 }, ink: 434, rocks: [
      [[124,430],[136,430],[142,1600],[118,1600]], [[174,410],[186,410],[192,1600],[168,1600]], [[234,430],[246,430],[252,1600],[228,1600]], [[284,410],[296,410],[302,1600],[278,1600]] ] },
  { name: 'Boulder Valley', L: { x: 100, y: 460 }, R: { x: 300, y: 400 }, ink: 382, rocks: [
      boulder(200, 445, 14) ] },
  { name: 'Leaning Pillar', L: { x: 100, y: 390 }, R: { x: 300, y: 390 }, ink: 366, rocks: [
      [[188,430],[208,424],[262,1600],[226,1600]] ] },
  { name: 'Cave Mouth', L: { x: 100, y: 380 }, R: { x: 300, y: 380 }, ink: 366, rocks: [
      [[40,280],[130,280],[130,330],[46,330]], [[270,280],[360,280],[354,330],[270,330]] ] },
  { name: 'Ruined Span', L: { x: 100, y: 390 }, R: { x: 300, y: 390 }, ink: 366, rocks: [
      [[160,392],[240,392],[240,404],[160,404]] ] },
  { name: 'Boulder Steps', L: { x: 90, y: 330 }, R: { x: 330, y: 420 }, ink: 460, rocks: [
      boulder(150, 370, 12), boulder(210, 390, 12), boulder(270, 410, 12) ] },
  { name: 'Stalactite Gorge', L: { x: 90, y: 370 }, R: { x: 350, y: 370 }, ink: 466, rocks: [
      [[150,440],[166,440],[174,1600],[142,1600]], [[274,440],[290,440],[298,1600],[266,1600]], [[195,240],[245,240],[224,338],[216,338]] ] },
];

// Convex rock outline (octagon) for floating boulders.
function boulder(cx, cy, r) {
  return Array.from({ length: 8 }, (_, i) => {
    const a = (i + 0.5) * Math.PI / 4;
    return [Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r)];
  });
}

const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let dpr = 1, cw = 0, ch = 0, s = 1, ox = 0, oy = 0;

let level = 0, L, engine, terrain = [], chassis, wheels = [], bridge = null, bridgeLocal = [];
let state = 'draw', points = [], used = 0, drawing = false, ghost = null;
let simTime = 0, motorAt = 0, motorOn = false, motorTarget = MOTOR, maxX = 0, lastProgress = 0, flipT = 0;
let flagX = 0, cardTimer = 0, arrived = false, arriveT = 0, settleT = 0;
const wheelProbe = Bodies.circle(0, 0, WHEEL_R + 2.5);   // slightly larger than a wheel, never added to the world
let carOff = { x: 0, y: 0 };
let lastStroke = null, replay = null;   // last released stroke, and the stroke being redrawn for a replay

// ---------- saved progress (per-viewer convenience only) ----------
let best = {};
try { best = JSON.parse(localStorage.getItem('span-sketch-best') || '{}') || {}; } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem('span-sketch-best', JSON.stringify(best)); } catch (e) {} }
// Least-steel winning stroke per span, kept with full precision so watching it reproduces the run exactly.
let runs = {};
try { runs = JSON.parse(localStorage.getItem('span-sketch-runs') || '{}') || {}; } catch (e) { runs = {}; }
function saveRuns() { try { localStorage.setItem('span-sketch-runs', JSON.stringify(runs)); } catch (e) {} }
function updateBestBtn() {
  const r = runs[level];
  // The chip always takes up space so the header (and the canvas below it) never changes height.
  $('bestBtn').disabled = !r;
  $('bestBtn').textContent = r ? `▶ Best ${(r.used / UNIT).toFixed(1)} m` : 'No best yet';
}

// ---------- theme colours, read from CSS tokens ----------
let C = {}, hatch = null;
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['paper','grid','grid-major','ink','rock','rock-fill','car','flag','text','muted','bad','panel'])
    C[k] = cs.getPropertyValue('--' + k).trim();
  const p = document.createElement('canvas'); p.width = p.height = 8;
  const g = p.getContext('2d');
  g.fillStyle = C['rock-fill']; g.fillRect(0, 0, 8, 8);
  g.strokeStyle = C.rock; g.globalAlpha = .45; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, 8); g.lineTo(8, 0); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(6, 10); g.lineTo(10, 6); g.stroke();
  hatch = ctx.createPattern(p, 'repeat');
}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- sizing ----------
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  s = Math.min(cw / VIEW.w, ch / VIEW.h);
  ox = (cw - VIEW.w * s) / 2 - VIEW.x * s;
  oy = (ch - VIEW.h * s) / 2 - VIEW.y * s;
}
new ResizeObserver(resize).observe($('stage'));
resize();

// ---------- level setup ----------
function cliffPolys(lv) {
  return [
    [[-600, lv.L.y], [lv.L.x, lv.L.y], [lv.L.x - 14, 1600], [-600, 1600]],
    [[lv.R.x, lv.R.y], [1000, lv.R.y], [1000, 1600], [lv.R.x + 14, 1600]],
    ...lv.rocks,
  ];
}

function buildLevel(i) {
  const next = (i + LEVELS.length) % LEVELS.length;
  if (next !== level) lastStroke = null;
  level = next;
  L = LEVELS[level];
  clearTimeout(cardTimer);
  engine = Engine.create({ positionIterations: 10, velocityIterations: 8, constraintIterations: 4 });
  engine.gravity.y = 1;
  terrain = cliffPolys(L).map(poly => {
    const verts = poly.map(([x, y]) => ({ x, y }));
    const b = Bodies.fromVertices(0, 0, [verts], { isStatic: true, friction: 0.9, frictionStatic: 1 });
    Body.setPosition(b, Vertices.centre(verts));
    return b;
  });
  Composite.add(engine.world, terrain);

  // car: chassis + two wheels pinned on axles; negative group keeps car parts from colliding with each other
  const group = Body.nextGroup(true);
  const cx = Math.max(32, L.L.x - 72), top = L.L.y;
  // Body and cabin are one rigid compound, so the roof collides with rock just like the rest of the car.
  const cy = top - WHEEL_R - 9;
  const base = Bodies.rectangle(cx, cy, 48, 12, { density: 0.002, chamfer: { radius: 4 } });
  const cabinVerts = [[-11, -6], [-6, -16], [9, -16], [16, -6]].map(([x, y]) => ({ x: cx + x, y: cy + y }));
  const cabin = Bodies.fromVertices(0, 0, [cabinVerts], { density: 0.00005 });   // near-weightless: shape only
  Body.setPosition(cabin, Vertices.centre(cabinVerts));
  chassis = Body.create({ parts: [base, cabin], collisionFilter: { group }, friction: 0.5 });
  [base, cabin].forEach(p => { p.collisionFilter = chassis.collisionFilter; p.friction = 0.5; });
  carOff = { x: cx - chassis.position.x, y: cy - chassis.position.y };   // drawing origin relative to centre of mass
  Body.setInertia(chassis, base.inertia);   // keep the handling the car had before the cabin collided
  wheels = [-16, 16].map(dx => Bodies.circle(cx + dx, top - WHEEL_R - 1, WHEEL_R, {
    collisionFilter: { group }, density: 0.0016, friction: 1, frictionStatic: 3, restitution: 0 }));
  const axles = wheels.map((w, k) => Constraint.create({
    bodyA: chassis, pointA: { x: (k ? 16 : -16) + carOff.x, y: 8 + carOff.y }, bodyB: w, stiffness: 1, length: 0 }));
  Composite.add(engine.world, [chassis, ...wheels, ...axles]);

  flagX = Math.min(380, L.R.x + 62);
  bridge = null; bridgeLocal = []; points = []; used = 0; drawing = false; ghost = null;
  simTime = 0; motorOn = false; motorTarget = MOTOR; flipT = 0; arrived = false; arriveT = 0; settleT = 0;
  state = 'draw'; replay = null;

  const gap = ((L.R.x - L.L.x) / UNIT).toFixed(1);
  $('spanNo').textContent = `Span ${String(level + 1).padStart(2, '0')} · gap ${gap} m`;
  $('spanName').textContent = L.name;
  $('hint').textContent = 'Draw a bridge. Lift your finger to test it.';
  $('hint').hidden = false;
  $('card').hidden = true;
  $('btnNext').disabled = false;
  $('btnReplay').disabled = !lastStroke;
  updateBestBtn();
  updateMeter();
}

function updateMeter() {
  const frac = Math.min(1, used / L.ink);
  $('meterFill').style.width = (frac * 100).toFixed(1) + '%';
  $('meter').classList.toggle('full', frac >= 0.999);
  $('steelRead').innerHTML = `${(used / UNIT).toFixed(1)} <span>/ ${(L.ink / UNIT).toFixed(1)} m steel</span>`;
}

// ---------- drawing ----------
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s };
}
function inside(p, vs) {
  let c = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    const a = vs[i], b = vs[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
  return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy);
}
function blocked(p) {
  const clear = T / 2 + 1.5;
  for (const b of terrain) {
    const vs = b.vertices;
    if (inside(p, vs)) return true;
    for (let i = 0; i < vs.length; i++) if (segDist(p, vs[i], vs[(i + 1) % vs.length]) < clear) return true;
  }
  const c = { x: chassis.position.x + carOff.x, y: chassis.position.y + carOff.y };   // car body centre
  return p.x > c.x - 27 - clear && p.x < c.x + 27 + clear && p.y > c.y - 22 - clear && p.y < L.L.y + clear;
}
function segBlocked(a, b) {
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 2.5));
  for (let i = 1; i <= n; i++) if (blocked({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n })) return true;
  return false;
}
function addPoint(p) {
  ghost = null;
  if (!points.length) { if (!blocked(p)) points.push(p); else ghost = { p, from: null }; return; }
  const last = points[points.length - 1];
  let d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d < 6) return;
  const left = L.ink - used;
  if (left < 1) return;
  if (d > left) { p = { x: last.x + (p.x - last.x) * left / d, y: last.y + (p.y - last.y) * left / d }; d = left; }
  if (segBlocked(last, p)) { ghost = { p, from: last }; return; }
  points.push(p); used += d; updateMeter();
}

canvas.addEventListener('pointerdown', e => {
  if (state !== 'draw' || !$('sheet').hidden) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  drawing = true; points = []; used = 0; updateMeter();
  addPoint(toWorld(e));
  $('hint').hidden = true;
});
canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) addPoint(toWorld(ev));
});
function endStroke() {
  if (!drawing) return;
  drawing = false; ghost = null;
  if (points.length < 2 || used < 12) {
    points = []; used = 0; updateMeter();
    $('hint').textContent = 'Too short. Drag a longer line across the gap.'; $('hint').hidden = false;
    return;
  }
  release();
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

// Turn the stroke into one rigid compound body made of short overlapping planks.
function release() {
  const parts = [];
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    parts.push(Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len + 1, T, {
      angle: Math.atan2(b.y - a.y, b.x - a.x), density: 0.0015 }));
  }
  // round every joint and both ends so wheels can roll up onto the deck
  for (const p of points) parts.push(Bodies.circle(p.x, p.y, T / 2, { density: 0.0015 }));
  bridge = Body.create({ parts, friction: 0.95, frictionStatic: 1.5, restitution: 0 });
  parts.forEach(p => { p.friction = 0.95; p.frictionStatic = 1.5; });
  const o = bridge.position;
  // Matter sums part inertias without the parallel-axis term, which makes long strokes spin wildly.
  let inertia = 0;
  for (const p of parts) inertia += p.inertia + p.mass * ((p.position.x - o.x) ** 2 + (p.position.y - o.y) ** 2) * 4;
  Body.setInertia(bridge, inertia);
  bridgeLocal = points.map(p => ({ x: p.x - o.x, y: p.y - o.y }));
  lastStroke = points.map(p => ({ ...p }));
  $('btnReplay').disabled = false;
  Composite.add(engine.world, bridge);
  state = 'run';
  motorAt = simTime + MOTOR_DELAY; lastProgress = motorAt; maxX = chassis.position.x;
  $('hint').textContent = 'Load test…'; $('hint').hidden = false;
}

// ---------- simulation ----------
function step() {
  simTime += STEP;
  if (state === 'run' && !motorOn && simTime >= motorAt) { motorOn = true; $('hint').hidden = true; }
  if (motorOn) for (const w of wheels)
    Body.setAngularVelocity(w, w.angularVelocity + (motorTarget - w.angularVelocity) * (motorTarget ? 0.2 : 0.35));
  // Wheel spin alone gives little grip in Matter, so push the chassis along its heading while a wheel touches ground.
  if (motorOn && motorTarget) {
    const ground = bridge ? [...terrain, bridge] : terrain;
    const hx = Math.cos(chassis.angle), hy = Math.sin(chassis.angle);
    const v = chassis.velocity.x * hx + chassis.velocity.y * hy;
    if (v < motorTarget * WHEEL_R) for (const w of wheels) {
      const hits = Query.collides(w, ground);
      if (!hits.length) continue;
      const f = { x: hx * 0.0011, y: hy * 0.0011 };
      Body.applyForce(chassis, chassis.position, f);
      // equal and opposite push on the bridge, so a loose bridge can be shoved off its supports
      if (bridge && hits.some(h => h.bodyA.parent === bridge || h.bodyB.parent === bridge))
        Body.applyForce(bridge, w.position, { x: -f.x, y: -f.y });
    }
  }
  Engine.update(engine, STEP);
  if (state !== 'run') return;

  const c = chassis.position;
  if (c.x > maxX + 1) { maxX = c.x; lastProgress = simTime; }
  let a = chassis.angle % (Math.PI * 2);
  if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2;
  flipT = Math.abs(a) > 2 ? flipT + STEP : 0;

  // Past the flag the car brakes; it wins only once it rests on both wheels, right side up, on the far cliff.
  if (!arrived && c.x >= flagX) { arrived = true; motorTarget = 0; }
  if (arrived) {
    arriveT += STEP;
    // Upright enough that it is not on its back or bumper, with at least one wheel on the bridge or rock.
    const ground = bridge ? [...terrain, bridge] : terrain;
    const onWheels = Math.abs(a) < 1 && c.y < L.R.y + 5 && wheels.some(w => {
      Body.setPosition(wheelProbe, w.position);
      return Query.collides(wheelProbe, ground).length > 0;
    });
    settleT = onWheels ? settleT + STEP : 0;
  }

  if (arrived && settleT >= 500) finish(true);
  else if (c.y > 950) finish(false, 'The car dropped into the canyon.');
  else if (flipT > 1000) finish(false, 'The car flipped over.');
  else if (arrived && arriveT > 3000) finish(false, 'The car reached the far side but did not land on its wheels.');
  else if (!arrived && motorOn && simTime - lastProgress > 3500) finish(false, 'The car got stuck and could not move forward.');
}

// ---------- replay: rebuild the span, redraw the saved stroke at drawing speed, then drop it ----------
function startReplay(stroke = lastStroke, label = 'Replay') {
  if (!stroke) return;
  buildLevel(level);
  replay = { stroke, k: 1, dist: 0 };
  points = [stroke[0]];
  state = 'replay';
  $('hint').textContent = label; $('hint').hidden = false;
}
function advanceReplay(dt) {
  const r = replay;
  r.dist += dt * 0.32;                       // world units drawn per millisecond
  while (r.k < r.stroke.length) {
    const a = r.stroke[r.k - 1], b = r.stroke[r.k];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (r.dist < d) break;
    r.dist -= d; points.push(b); used += d; r.k++;
  }
  updateMeter();
  if (r.k >= r.stroke.length) { replay = null; release(); }
}

function finish(won, why) {
  state = 'done';
  if (won) motorTarget = 0;
  else motorOn = false;
  const ratio = used / L.ink;
  // Stars follow the percentage shown on the card: 60% or less = 3, 80% or less = 2, any other win = 1.
  const pct = Math.round(ratio * 100);
  const stars = won ? (pct <= 60 ? 3 : pct <= 80 ? 2 : 1) : 0;
  if (won && stars > (best[level] || 0)) { best[level] = stars; saveBest(); }
  const prev = runs[level];
  const newBest = won && (!prev || used < prev.used - 0.01);
  if (newBest) { runs[level] = { used, pts: points.map(p => [p.x, p.y]) }; saveRuns(); updateBestBtn(); }
  cardTimer = setTimeout(() => {
    $('cardTitle').textContent = won ? 'Bridge held' : 'Bridge failed';
    $('cardTitle').className = won ? 'win' : 'lose';
    $('cardStars').innerHTML = won ? starHtml(stars) : '';
    $('cardStars').hidden = !won;
    $('cardText').textContent = won
      ? `The car crossed using ${(used / UNIT).toFixed(1)} m of steel (${pct}% of the allowance). ${newBest && prev ? 'New best for this span.' : 'Use less steel for more stars.'}`
      : why + ' Try resting the bridge on the cliff edges or an outcrop.';
    $('card').hidden = false;
  }, won ? 700 : 400);
}
function starHtml(n) {
  return [0, 1, 2].map(i => i < n ? '★' : '<span class="off">★</span>').join('');
}

// ---------- rendering ----------
function poly(vs) {
  ctx.beginPath(); ctx.moveTo(vs[0].x, vs[0].y);
  for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
  ctx.closePath();
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  const x0 = -ox / s, x1 = (cw - ox) / s, y0 = -oy / s, y1 = (ch - oy) / s;

  // graph paper: 1 m minor, 5 m major
  ctx.lineWidth = 1 / s;
  for (let k = 0; k < 2; k++) {
    const stepU = k ? UNIT * 5 : UNIT;
    ctx.strokeStyle = k ? C['grid-major'] : C.grid;
    ctx.beginPath();
    for (let x = Math.floor(x0 / stepU) * stepU; x <= x1; x += stepU) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / stepU) * stepU; y <= y1; y += stepU) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
  }

  // dimension line across the gap
  const dy = Math.min(L.L.y, L.R.y) - 46;
  ctx.strokeStyle = C.muted; ctx.fillStyle = C.muted; ctx.lineWidth = 1.2;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(L.L.x, dy - 8); ctx.lineTo(L.L.x, L.L.y - 4); ctx.moveTo(L.R.x, dy - 8); ctx.lineTo(L.R.x, L.R.y - 4); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(L.L.x, dy); ctx.lineTo(L.R.x, dy); ctx.stroke();
  for (const [x, d] of [[L.L.x, 1], [L.R.x, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, dy); ctx.lineTo(x + 7 * d, dy - 3); ctx.lineTo(x + 7 * d, dy + 3); ctx.closePath(); ctx.fill();
  }
  const label = ((L.R.x - L.L.x) / UNIT).toFixed(1) + ' m';
  ctx.font = '600 11px "IBM Plex Mono", ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(label).width + 8, mx = (L.L.x + L.R.x) / 2;
  ctx.fillStyle = C.paper; ctx.fillRect(mx - tw / 2, dy - 8, tw, 16);
  ctx.fillStyle = C.muted; ctx.fillText(label, mx, dy);

  // terrain
  for (const b of terrain) {
    poly(b.vertices);
    ctx.fillStyle = hatch || C['rock-fill']; ctx.fill();
    ctx.strokeStyle = C.rock; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  }

  // goal flag
  const fy = L.R.y;
  ctx.strokeStyle = C.text; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(flagX, fy); ctx.lineTo(flagX, fy - 42); ctx.stroke();
  ctx.fillStyle = C.flag;
  ctx.beginPath(); ctx.moveTo(flagX, fy - 42); ctx.lineTo(flagX + 22, fy - 35); ctx.lineTo(flagX, fy - 28); ctx.closePath(); ctx.fill();

  // bridge
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (state === 'draw' || state === 'replay') {
    if (points.length) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = T;
      ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
      for (const p of points) ctx.lineTo(p.x, p.y);
      if (points.length === 1) ctx.lineTo(points[0].x + 0.1, points[0].y);
      ctx.stroke();
    }
    if (ghost) {
      ctx.strokeStyle = C.bad; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath();
      if (ghost.from) { ctx.moveTo(ghost.from.x, ghost.from.y); ctx.lineTo(ghost.p.x, ghost.p.y); }
      ctx.arc(ghost.p.x, ghost.p.y, 7, 0, Math.PI * 2);
      ctx.stroke(); ctx.setLineDash([]);
    }
  } else if (bridge) {
    ctx.save();
    ctx.translate(bridge.position.x, bridge.position.y); ctx.rotate(bridge.angle);
    ctx.strokeStyle = C.ink; ctx.lineWidth = T;
    ctx.beginPath(); ctx.moveTo(bridgeLocal[0].x, bridgeLocal[0].y);
    for (const p of bridgeLocal) ctx.lineTo(p.x, p.y);
    ctx.stroke();
    // rivets every ~1 m
    ctx.fillStyle = C.paper; let acc = 0;
    for (let i = 1; i < bridgeLocal.length; i++) {
      const a = bridgeLocal[i - 1], b = bridgeLocal[i];
      acc += Math.hypot(b.x - a.x, b.y - a.y);
      if (acc >= UNIT) { acc = 0; ctx.beginPath(); ctx.arc(b.x, b.y, 1.4, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  // car
  for (const w of wheels) {
    ctx.save(); ctx.translate(w.position.x, w.position.y); ctx.rotate(w.angle);
    ctx.fillStyle = C.text; ctx.beginPath(); ctx.arc(0, 0, WHEEL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.paper; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-WHEEL_R + 2.5, 0); ctx.lineTo(WHEEL_R - 2.5, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.translate(chassis.position.x, chassis.position.y); ctx.rotate(chassis.angle); ctx.translate(carOff.x, carOff.y);
  ctx.fillStyle = C.car;
  ctx.beginPath(); ctx.moveTo(-11, -6); ctx.lineTo(-6, -16); ctx.lineTo(9, -16); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.paper;
  ctx.beginPath(); ctx.moveTo(-7, -7); ctx.lineTo(-4, -13); ctx.lineTo(1, -13); ctx.lineTo(1, -7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, -7); ctx.lineTo(4, -13); ctx.lineTo(8, -13); ctx.lineTo(12, -7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.car;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-24, -6, 48, 12, 4) : ctx.rect(-24, -6, 48, 12); ctx.fill();
  ctx.fillStyle = C.flag; ctx.fillRect(20, -3, 4, 3);
  ctx.restore();
}

let last = performance.now(), accum = 0;
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  if (state === 'replay') advanceReplay(dt);
  else if (state !== 'draw') { accum += dt; while (accum >= STEP) { step(); accum -= STEP; } }
  else accum = 0;
  if (cw > 0 && ch > 0) render();
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function renderLevelList() {
  $('levelList').innerHTML = LEVELS.map((lv, i) => `
    <button class="lvl${i === level ? ' current' : ''}" data-i="${i}">
      <small>Span ${String(i + 1).padStart(2, '0')} · ${((lv.R.x - lv.L.x) / UNIT).toFixed(1)} m gap</small>
      <b>${lv.name}</b>
      <span class="stars">${starHtml(best[i] || 0)}</span>
      ${runs[i] ? `<small>Best ${(runs[i].used / UNIT).toFixed(1)} m</small>` : ''}
    </button>`).join('');
}
$('levelList').addEventListener('click', e => {
  const b = e.target.closest('.lvl'); if (!b) return;
  $('sheet').hidden = true; buildLevel(+b.dataset.i);
});
$('btnLevels').onclick = () => { renderLevelList(); $('sheet').hidden = !$('sheet').hidden; };
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
$('btnReplay').onclick = () => { $('sheet').hidden = true; startReplay(); };
$('bestBtn').onclick = () => {
  const r = runs[level]; if (!r) return;
  $('sheet').hidden = true;
  startReplay(r.pts.map(([x, y]) => ({ x, y })), `Best run · ${(r.used / UNIT).toFixed(1)} m`);
};
$('btnRetry').onclick = () => { $('sheet').hidden = true; buildLevel(level); };
$('btnNext').onclick = () => { $('sheet').hidden = true; buildLevel(level + 1); };

window.claude?.hot?.snapshot?.(() => ({ level }));
const start = data => { buildLevel((data && data.level) || 0); requestAnimationFrame(frame); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
