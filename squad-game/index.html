<style>
/* Layout: one-screen portrait app. Header (level, squad count, progress, best chip), full-bleed canvas, footer controls. */
:root {
  --road: #e8ecf0; --road-mark: #cdd5dd; --edge: #b9c4cf; --shoulder: #d3dae1;
  --squad: #2f6fe0; --squad-dark: #173e8c; --foe: #d8432c; --foe-dark: #8a2412;
  --gate-good: #1c9a5a; --gate-bad: #d23b3b; --gold: #d99a00; --shot: #e89a00;
  --shot-rifle: #0f9fb8; --shot-shotgun: #c8358f; --shot-minigun: #7346d4;
  --text: #17202a; --muted: #5a6878; --panel: #ffffff; --line: #c7d2dc;
  --good: #1c8547; --bad: #c22f2f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --road: #161c25; --road-mark: #262f3c; --edge: #34404f; --shoulder: #0e131a;
    --squad: #5f97ff; --squad-dark: #a9c6ff; --foe: #ff6a4f; --foe-dark: #ffb3a3;
    --gate-good: #3ccf86; --gate-bad: #ff6060; --gold: #ffc93d; --shot: #ffd25a;
  --shot-rifle: #4fd8ff; --shot-shotgun: #ff7ad1; --shot-minigun: #b69bff;
    --text: #e9f1f9; --muted: #9db2ca; --panel: #1d2531; --line: #34404f;
    --good: #6fe0a0; --bad: #ff8080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --road: #161c25; --road-mark: #262f3c; --edge: #34404f; --shoulder: #0e131a;
  --squad: #5f97ff; --squad-dark: #a9c6ff; --foe: #ff6a4f; --foe-dark: #ffb3a3;
  --gate-good: #3ccf86; --gate-bad: #ff6060; --gold: #ffc93d; --shot: #ffd25a;
  --shot-rifle: #4fd8ff; --shot-shotgun: #ff7ad1; --shot-minigun: #b69bff;
  --text: #e9f1f9; --muted: #9db2ca; --panel: #1d2531; --line: #34404f;
  --good: #6fe0a0; --bad: #ff8080;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--road); color: var(--text); font-family: var(--sans);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 12px; background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
header.bar { justify-content: space-between; border-bottom: 1.5px solid var(--line); }
footer.bar { border-top: 1.5px solid var(--line); gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.lvl-id { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { white-space: nowrap; font: 600 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lvl-name { font: 20px/1.15 var(--display); color: var(--squad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.squad-read { font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.squad-read span { color: var(--muted); font-weight: 400; }
.meter { width: 112px; height: 8px; border: 1.5px solid var(--squad); border-radius: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; background: var(--squad); }
.best-chip {
  font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--squad);
  background: transparent; border: 1.5px solid var(--squad); border-radius: 999px;
  padding: 6px 10px; margin-top: 2px; cursor: pointer; white-space: nowrap;
}
.best-chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.best-chip:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
#stage { flex: 1; position: relative; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px); text-align: center; white-space: nowrap;
  font: 14px/1.3 var(--display); color: var(--squad); pointer-events: none;
  background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 12px; border-radius: 8px;
}
.btn {
  font: 600 15px/1 var(--sans); min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--squad); color: var(--panel); border-color: var(--squad); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
footer .grow { flex: 1; }
.card {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  margin-inline: auto; max-width: 380px;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.card h2 { margin: 0; font: 24px/1.15 var(--display); font-weight: 400; text-wrap: balance; }
.card h2.win { color: var(--good); } .card h2.lose { color: var(--bad); }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.stars { font: 26px/1 var(--sans); letter-spacing: .15em; color: var(--gold); }
.stars .off { color: var(--line); }
.sheet {
  position: absolute; inset: 0; background: color-mix(in srgb, var(--road) 94%, transparent);
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px;
}
.sheet h2 { margin: 0; font: 22px/1.1 var(--display); font-weight: 400; color: var(--squad); }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lvl {
  text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text);
  font: inherit; cursor: pointer; min-width: 0;
}
.lvl.current { border-color: var(--squad); }
.lvl b { font: 15px/1.15 var(--display); color: var(--squad); font-weight: 400; overflow-wrap: anywhere; }
.lvl small { font: 12px/1.2 var(--mono); color: var(--muted); }
.lvl .stars { font-size: 16px; }
</style>

<div id="app">
  <header class="bar">
    <div class="lvl-id">
      <div class="eyebrow" id="lvlNo">Level 01 · Pistol</div>
      <div class="lvl-name" id="lvlName">Pistol Patrol</div>

  <div id="stage">
    <canvas id="c" aria-label="Battlefield. Drag left and right to steer your squad."></canvas>
    <div class="hint" id="hint">Touch and drag to steer</div>
    <div class="card" id="card" hidden>
      <h2 id="cardTitle">Boss down</h2>
      <div class="stars" id="cardStars"></div>
      <p id="cardText"></p>
    </div>
    <div class="sheet" id="sheet" hidden>
      <h2>Choose a level</h2>
      <div class="levels" id="levelList"></div>
      <button class="btn" id="sheetClose">Back</button>
    </div>
  </div>
  <footer class="bar">
    <button class="btn" id="btnLevels">Levels</button>
    <div class="grow"></div>
    <button class="btn" id="btnReplay" disabled>Replay</button>
    <button class="btn" id="btnRetry">Retry</button>
    <button class="btn primary" id="btnNext">Next</button>
  </footer>
</div>

// Formation: sunflower spiral; soldier i of n sits at off(i, n) from the squad centre.
const spacing = n => 6.4 * Math.min(1, Math.sqrt(SPREAD / Math.max(n, 1)));
function off(i, n) { const r = spacing(n) * Math.sqrt(i), a = i * 2.399963; return [r * Math.cos(a), r * Math.sin(a)]; }
const radius = n => 6.4 * Math.sqrt(Math.min(Math.max(n, 1), SPREAD)) + 5;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

function applyOp(s, op) {
  if (WEAPONS[op]) { s.wpn = op; return; }
  const v = +op.slice(1), c = op[0];
  s.n = c === '+' ? s.n + v : c === '-' ? s.n - v : c === 'x' ? s.n * v : Math.floor(s.n / v);
  s.n = Math.max(0, s.n);
}
const opGood = op => !!WEAPONS[op] || op[0] === '+' || op[0] === 'x';
const opLabel = op => WEAPONS[op] ? WEAPONS[op].name : ({ '+': '+', '-': '−', 'x': '×', '/': '÷' })[op[0]] + op.slice(1);

// ---- Simulation: plain data, no rendering, so it can be cloned and run headless. ----
function create(li, quiet = false) {
  const lv = LEVELS[li];
  const s = { li, t: 0, z: 0, x: MID, n: lv.start, wpn: lv.weapon, kills: 0, quiet,
    gates: [], foes: [], shots: [], boss: { x: MID, z: lv.len + 360, hp: lv.boss }, over: null, ev: [] };
  for (const row of lv.rows) {
    if (row.k === 'g') { s.gates.push({ z: row.z, l: row.l, r: row.r, used: null }); continue; }
    const F = FOES[row.type], gap = F.r * 2 + 8;
    const cols = clamp(Math.floor((row.x1 - row.x0) / gap), 1, row.n);
    for (let i = 0; i < row.n; i++) {
      const c = i % cols, rr = Math.floor(i / cols);
      s.foes.push({ type: row.type, x: row.x0 + (c + 0.5) * (row.x1 - row.x0) / cols, z: row.z + rr * (F.r * 2 + 10) + (c % 2) * 6, hp: F.hp, r: F.r });
    }
  }
  return s;
}
function ev(s, e) { if (!s.quiet) s.ev.push(e); }

function tick(s, tx) {
  if (s.over) return;
  const lv = LEVELS[s.li];
  s.t++;
  let R = radius(s.n), lo = Math.min(R, MID);
  s.x = clamp(s.x + clamp(clamp(tx, lo, W - lo) - s.x, -MOVE, MOVE), lo, W - lo);
  if (s.z < lv.len) s.z = Math.min(lv.len, s.z + (lv.speed || SPEED) * DT);

  for (const gt of s.gates) if (!gt.used && s.z >= gt.z) {
    const side = s.x < MID ? 'l' : 'r', op = gt[side];
    gt.used = side;
    if (op) { applyOp(s, op); ev(s, { e: 'gate', op, x: side === 'l' ? MID / 2 : MID * 1.5, z: gt.z }); }
  }
  R = radius(s.n);

  // Fire: up to SHOOTERS soldiers shoot, staggered; extra soldiers add damage per shot.
  const wp = WEAPONS[s.wpn], S = Math.min(s.n, SHOOTERS), d = S ? s.n / S * wp.dmg : 0;
  for (let j = 0; j < S; j++) if ((s.t + j * 7) % wp.every === 0) {
    const o = off(Math.floor(j * s.n / S), s.n);
    for (let p = 0; p < wp.pellets; p++)
      s.shots.push({ x: s.x + o[0], z: s.z + o[1] + 6, vx: (p - (wp.pellets - 1) / 2) * 60, d, life: RANGE, w: s.wpn });
  }

  const b = s.boss, adv = SHOT_V * DT;
  let k = 0;
  for (const sh of s.shots) {
    sh.z += adv; sh.x += sh.vx * DT; sh.life -= adv;
    let hit = false;
    for (const f of s.foes) {
      if (f.hp > 0 && Math.abs(f.z - sh.z) < f.r + 4 && Math.abs(f.x - sh.x) < f.r + 2) {
        f.hp -= sh.d; hit = true;
        if (f.hp <= 0) { s.kills++; ev(s, { e: 'die', x: f.x, z: f.z, r: f.r }); }
        break;
      }
    }
    if (!hit && b.hp > 0 && Math.abs(b.z - sh.z) < BOSS_R && Math.abs(b.x - sh.x) < BOSS_R) { b.hp -= sh.d; hit = true; }
    if (!hit && sh.life > 0 && sh.x > -10 && sh.x < W + 10) s.shots[k++] = sh;
  }
  s.shots.length = k;

  const reach = R * 0.75;
  k = 0;
  for (const f of s.foes) {
    if (f.hp <= 0) continue;
    const F = FOES[f.type];
    if (f.z - s.z < WAKE) { f.z -= F.v * DT; f.x += clamp(s.x - f.x, -F.side * DT, F.side * DT); }
    const dz = f.z - s.z;
    if (dz < reach + f.r && dz > -R - f.r && Math.abs(f.x - s.x) < R + f.r - 2) {
      s.n = Math.max(0, s.n - F.bite); ev(s, { e: 'bite', x: f.x, z: f.z, r: f.r });
      continue;
    }
    if (dz < -80) continue;
    s.foes[k++] = f;
  }
  s.foes.length = k;

  if (b.hp > 0 && s.z >= lv.len - BOSS_WAKE) {
    b.z -= BOSS_V * DT; b.x += clamp(s.x - b.x, -10 * DT, 10 * DT);
    if (b.z - s.z < reach + BOSS_R) s.over = { won: false, why: 'boss' };
  }
  if (!s.over && s.n <= 0) s.over = { won: false, why: 'wiped' };
  if (!s.over && b.hp <= 0) { s.over = { won: true }; ev(s, { e: 'boss', x: b.x, z: b.z }); }
  if (!s.over && s.t > 60 * 240) s.over = { won: false, why: 'time' };
}
function starsFor(li, won, n) { const lv = LEVELS[li]; return !won ? 0 : n >= lv.three ? 3 : n >= lv.two ? 2 : 1; }
// Run a recorded input list ([[tick, x], ...]) to the end, headless.
function run(li, inputs) {
  const s = create(li, true);
  let i = 0, tx = MID;
  while (!s.over) { while (i < inputs.length && inputs[i][0] <= s.t) tx = inputs[i++][1]; tick(s, tx); }
  return { won: s.over.won, why: s.over.why, n: s.n, t: s.t, stars: starsFor(li, s.over.won, s.n) };
}

// ---- Saved progress ----
const $ = id => document.getElementById(id);
let best = {}, runs = {};
try { best = JSON.parse(localStorage.getItem('squad-surge-best') || '{}') || {}; } catch (e) { best = {}; }
// Saved runs are input recordings, valid only for the simulation they were recorded on: bump SIM_V on any change to tick().
const SIM_V = 3, RUNS_KEY = 'squad-surge-runs-v' + SIM_V;
try { runs = JSON.parse(localStorage.getItem(RUNS_KEY) || '{}') || {}; localStorage.removeItem('squad-surge-runs'); } catch (e) { runs = {}; }
function saveBest() { try { localStorage.setItem('squad-surge-best', JSON.stringify(best)); } catch (e) {} }
function saveRuns() { try { localStorage.setItem(RUNS_KEY, JSON.stringify(runs)); } catch (e) {} }
let startLevel = 0;
try { startLevel = clamp(+localStorage.getItem('squad-surge-level') || 0, 0, LEVELS.length - 1); } catch (e) {}

// ---- Game state ----
let cur, mode = 'ready', rec = [], lastTx = null, input = MID, drag = null;
let replay = null, ri = 0, rtx = MID, lastRun = null, acc = 0, last = 0, cardTimer = 0, fx = [];
// End-of-level outro (visual only): bullets in flight finish; after a win the camera keeps scrolling so the squad
// slides off the bottom of the screen. The result card shows when it's done.
let outro = null;
const OUTRO_MAX = 6000;
const cv = $('c'), ctx = cv.getContext('2d');
let cw = 0, ch = 0, dpr = 1, sc = 1, ox = 0, col = {};

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['road', 'road-mark', 'edge', 'shoulder', 'squad', 'squad-dark', 'foe', 'foe-dark', 'gate-good', 'gate-bad', 'gold', 'shot', 'shot-rifle', 'shot-shotgun', 'shot-minigun', 'text', 'panel'])
    col[k] = cs.getPropertyValue('--' + k).trim();
}
function resize() {
  const r = $('stage').getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; cw = r.width; ch = r.height;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  sc = Math.min(cw / W, ch / VIEW_H); ox = (cw - W * sc) / 2;
}

function load(li) {
  li = (li + LEVELS.length) % LEVELS.length;
  clearTimeout(cardTimer); outro = null;
  cur = create(li); mode = 'ready'; rec = []; lastTx = null; input = MID; drag = null; acc = 0; fx = [];
  try { localStorage.setItem('squad-surge-level', li); } catch (e) {}
  const lv = LEVELS[li];
  $('lvlName').textContent = lv.name;
  $('card').hidden = true; $('sheet').hidden = true;
  showHint('Touch and drag to steer');
  $('btnReplay').disabled = !(lastRun && lastRun.li === li);
  updateBestBtn(); updateHud(true);
}
function startReplay(inputs, label) {
  const li = cur.li;
  clearTimeout(cardTimer); outro = null;
  cur = create(li); mode = 'replay'; replay = inputs; ri = 0; rtx = MID; acc = 0; fx = [];
  $('card').hidden = true; $('sheet').hidden = true;
  showHint(label, 2000);
}
let hintTimer = 0;
function showHint(t, ms) {
  clearTimeout(hintTimer);
  $('hint').textContent = t; $('hint').hidden = !t;
  if (t && ms) hintTimer = setTimeout(() => { $('hint').hidden = true; }, ms);
}
function updateBestBtn() {
  const r = runs[cur.li];
  $('bestBtn').disabled = !r;
  $('bestBtn').textContent = r ? `Best ${r.n} ▶` : 'No best yet';
}
let hud = '';
function updateHud(force) {
  const s = cur, lv = LEVELS[s.li];
  const key = s.li + '|' + s.n + '|' + s.wpn + '|' + Math.round(s.z / 10);
  if (key === hud && !force) return;
  hud = key;
  $('lvlNo').textContent = `Level ${String(s.li + 1).padStart(2, '0')} · ${WEAPONS[s.wpn].name}`;
  $('squadRead').innerHTML = `${s.n} <span>soldier${s.n === 1 ? '' : 's'}</span>`;
  $('meterFill').style.width = (100 * s.z / lv.len).toFixed(1) + '%';
}

function liveTick() {
  let tx;
  if (mode === 'replay') {
    while (ri < replay.length && replay[ri][0] <= cur.t) rtx = replay[ri++][1];
    tx = rtx;
  } else {
    tx = Math.round(input);
    if (tx !== lastTx) { rec.push([cur.t, tx]); lastTx = tx; }
  }
  tick(cur, tx);
}

function finish() {
  const s = cur, li = s.li, lv = LEVELS[li], won = s.over.won, wasReplay = mode === 'replay';
  mode = 'done'; drag = null;
  const stars = starsFor(li, won, s.n);
  if (!wasReplay) {
    lastRun = { li, in: rec };
    $('btnReplay').disabled = false;
    if (won && (!runs[li] || s.n > runs[li].n)) { runs[li] = { n: s.n, in: rec }; saveRuns(); updateBestBtn(); }
    if (stars > (best[li] || 0)) { best[li] = stars; saveBest(); }
  }
  outro = { cam: s.z, t: 0, scroll: won ? (lv.speed || SPEED) : 0, done: () => {
    showHint('');
    $('cardTitle').textContent = !won ? (s.over.why === 'boss' ? 'Boss broke through' : 'Squad wiped out')
      : stars === 3 ? 'Great job!' : 'Boss down';
    $('cardTitle').className = won ? 'win' : 'lose';
    $('cardStars').innerHTML = won ? starHtml(stars) : '';
    $('cardStars').hidden = !won;
    const made = `${s.n} soldier${s.n === 1 ? '' : 's'} made it.`;
    $('cardText').textContent = !won
      ? (s.over.why === 'boss' ? 'Grow the squad or grab better guns before the boss arrives.' : 'Pick the plus gates and steer around the horde.')
      : stars === 3 ? made : `${made} Finish with ${lv.three}+ for 3 stars.`;
    $('card').hidden = false;
  } };
}
function stepOutro(dt) {
  const s = cur, o = outro, k = dt / 1000;
  if (o.finished) return;   // keep the final camera position behind the card
  o.t += dt; o.cam += o.scroll * k;
  for (const sh of s.shots) { sh.z += SHOT_V * k; sh.x += sh.vx * k; sh.life -= SHOT_V * k; }
  s.shots = s.shots.filter(sh => sh.life > 0 && sh.x > -10 && sh.x < W + 10);
  // The squad is off screen once its front edge passes below the bottom of the view.
  const sy = ch - VIEW_BACK * sc, frontY = sy - (s.z + radius(s.n) - o.cam) * sc;
  const squadGone = !o.scroll || s.n <= 0 || frontY > ch + 30 * sc;
  if ((!s.shots.length && squadGone) || o.t > OUTRO_MAX) { o.finished = true; cardTimer = setTimeout(o.done, 250); }
}
function starHtml(n) { let h = ''; for (let i = 0; i < 3; i++) h += i < n ? '★' : '<span class="off">★</span>'; return h; }

// ---- Input: drag anywhere; the squad follows the finger's sideways movement 1:1 ----
cv.addEventListener('pointerdown', e => {
  if (mode === 'ready') { mode = 'play'; showHint(''); }
  if (mode !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, px: e.clientX, tx: input };
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || mode !== 'play') return;
  input = clamp(drag.tx + (e.clientX - drag.px) / sc, 0, W);
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ---- Rendering ----
function render(now) {
  const s = cur, lv = LEVELS[s.li];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cz = outro ? outro.cam : s.z;   // camera follows the squad, except during the outro
  const sy = ch - VIEW_BACK * sc, Y = z => sy - (z - cz) * sc, X = x => ox + x * sc;
  const zTop = cz + sy / sc + 40, zBot = cz - (ch - sy) / sc - 40;
  ctx.fillStyle = col.shoulder; ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = col.road; ctx.fillRect(X(0), 0, W * sc, ch);
  // Scrolling centre dashes and edge bands
  ctx.fillStyle = col['road-mark'];
  for (let z = Math.floor(zBot / 60) * 60; z < zTop; z += 60) ctx.fillRect(X(MID) - 2 * sc, Y(z + 30), 4 * sc, 30 * sc);
  ctx.fillStyle = col.edge;
  ctx.fillRect(X(0), 0, 4 * sc, ch); ctx.fillRect(X(W) - 4 * sc, 0, 4 * sc, ch);
  // Finish line
  if (lv.len < zTop && lv.len > zBot) {
    const y = Y(lv.len), q = 12 * sc;
    ctx.fillStyle = col.text;
    for (let i = 0; i * 12 < W; i++) { ctx.fillRect(X(i * 12), y - (i % 2 ? q : 0), q, q); }
  }
  // Gates
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const gt of s.gates) {
    if (gt.z > zTop || gt.z < zBot) continue;
    for (const side of ['l', 'r']) {
      const op = gt[side];
      if (!op) continue;
      const x0 = side === 'l' ? 6 : MID + 4, x1 = side === 'l' ? MID - 4 : W - 6;
      const c = WEAPONS[op] ? col.gold : opGood(op) ? col['gate-good'] : col['gate-bad'];
      const used = gt.used === side, faded = gt.used && !used;
      ctx.globalAlpha = faded ? 0.25 : used ? 0.4 : 1;
      const y = Y(gt.z), h = 26 * sc;
      ctx.fillStyle = c; ctx.globalAlpha *= 0.28; ctx.fillRect(X(x0), y - h / 2, (x1 - x0) * sc, h);
      ctx.globalAlpha = faded ? 0.25 : used ? 0.4 : 1;
      ctx.strokeStyle = c; ctx.lineWidth = 2.5 * sc; ctx.strokeRect(X(x0), y - h / 2, (x1 - x0) * sc, h);
      ctx.fillStyle = c; ctx.font = `${Math.round((WEAPONS[op] ? 15 : 20) * sc)}px Bungee, "Arial Black", sans-serif`;
      ctx.fillText(opLabel(op), X((x0 + x1) / 2), y + sc);
      ctx.globalAlpha = 1;
    }
  }
  // Foes
  for (const f of s.foes) {
    if (f.z > zTop || f.z < zBot) continue;
    const x = X(f.x), y = Y(f.z), r = f.r * sc;
    ctx.fillStyle = col.foe; ctx.strokeStyle = col['foe-dark']; ctx.lineWidth = 1.5 * sc;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col['foe-dark']; ctx.beginPath(); ctx.arc(x, y + r * 0.35, r * 0.4, 0, 7); ctx.fill();
    const F = FOES[f.type];
    if (F.hp > 3 && f.hp < F.hp) hpBar(x, y - r - 6 * sc, r * 2, f.hp / F.hp);
  }
  // Boss
  const b = s.boss;
  if (b.hp > 0 && b.z < zTop && b.z > zBot) {
    const x = X(b.x), y = Y(b.z), r = BOSS_R * sc;
    ctx.fillStyle = col.foe; ctx.strokeStyle = col['foe-dark']; ctx.lineWidth = 3 * sc;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col['foe-dark'];
    ctx.beginPath(); ctx.arc(x - r * 0.35, y + r * 0.2, r * 0.14, 0, 7); ctx.arc(x + r * 0.35, y + r * 0.2, r * 0.14, 0, 7); ctx.fill();
    hpBar(x, y - r - 12 * sc, 120 * sc, b.hp / lv.boss);
    ctx.fillStyle = col.text; ctx.font = `600 ${Math.round(12 * sc)}px "IBM Plex Mono", monospace`;
    ctx.fillText('BOSS ' + Math.ceil(b.hp), x, y - r - 24 * sc);
  }
  // Shots, coloured by the weapon that fired them
  ctx.lineWidth = 2 * sc;
  for (const w in WEAPONS) {
    ctx.strokeStyle = col[SHOT_COLOR[w]]; ctx.beginPath();
    for (const sh of s.shots) if (sh.w === w) { const x = X(sh.x), y = Y(sh.z); ctx.moveTo(x, y); ctx.lineTo(x - sh.vx * 0.015 * sc, y + 8 * sc); }
    ctx.stroke();
  }
  // Squad
  const sr = 4.5 * sc;
  ctx.fillStyle = col.squad; ctx.strokeStyle = col['squad-dark']; ctx.lineWidth = 1.2 * sc;
  ctx.beginPath();
  // Draw a full, even formation of up to SPREAD figures (sampling a bigger spiral by stride makes pinwheel arms).
  const drawN = Math.min(s.n, SPREAD), pos = [];
  for (let i = 0; i < drawN; i++) { const o = off(i, drawN); pos.push([X(s.x + o[0]), Y(s.z + o[1])]); }
  for (const [x, y] of pos) { ctx.moveTo(x + sr, y); ctx.arc(x, y, sr, 0, 7); }
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = col['squad-dark']; ctx.lineWidth = 1.6 * sc; ctx.beginPath();
  for (const [x0, y] of pos) { const x = x0 + sr * 0.5; ctx.moveTo(x, y); ctx.lineTo(x, y - sr * 1.6); }
  ctx.stroke();
  if (s.n > 0) {
    const R = radius(s.n), x = X(s.x), y = Y(s.z - R) + 14 * sc;
    const t = String(s.n);
    ctx.font = `${Math.round(14 * sc)}px Bungee, "Arial Black", sans-serif`;
    const tw = ctx.measureText(t).width + 14 * sc;
    ctx.fillStyle = col.squad; roundRect(x - tw / 2, y - 10 * sc, tw, 20 * sc, 10 * sc); ctx.fill();
    ctx.fillStyle = col.panel; ctx.fillText(t, x, y + 1);
  }
  // Effects: gate pops and hit puffs (visual only, not part of the simulation)
  for (const e of s.ev) fx.push({ ...e, t0: now });
  s.ev.length = 0;
  fx = fx.filter(e => now - e.t0 < 800);
  for (const e of fx) {
    const a = (now - e.t0) / 800, x = X(e.x), y = Y(e.z);
    ctx.globalAlpha = 1 - a;
    if (e.e === 'gate') {
      ctx.fillStyle = WEAPONS[e.op] ? col.gold : opGood(e.op) ? col['gate-good'] : col['gate-bad'];
      ctx.font = `${Math.round(26 * sc)}px Bungee, "Arial Black", sans-serif`;
      ctx.fillText(opLabel(e.op), x, y - a * 50 * sc);
    } else {
      ctx.strokeStyle = e.e === 'bite' ? col.squad : col.foe; ctx.lineWidth = 2 * sc;
      ctx.beginPath(); ctx.arc(x, y, (e.r || 40) * sc * (1 + a * (e.e === 'boss' ? 3 : 1.2)), 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}
function hpBar(cx, y, wd, f) {
  ctx.fillStyle = col.edge; ctx.fillRect(cx - wd / 2, y, wd, 5 * sc);
  ctx.fillStyle = col.foe; ctx.fillRect(cx - wd / 2, y, wd * clamp(f, 0, 1), 5 * sc);
}
function roundRect(x, y, w2, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w2, y, x + w2, y + h, r); ctx.arcTo(x + w2, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w2, y, r); ctx.closePath();
}

function frame(now) {
  const dt = Math.min(100, now - (last || now)) * (window.__speed || 1);
  last = now;
  if (mode === 'play' || mode === 'replay') {
    acc += dt;
    while (acc >= STEP && !cur.over) { liveTick(); acc -= STEP; }
    if (cur.over) finish();
  } else if (outro) stepOutro(dt);
  render(now); updateHud();
  requestAnimationFrame(frame);
}

function renderLevelList() {
  $('levelList').innerHTML = LEVELS.map((lv, i) => {
    const r = runs[i];
    return `<button class="lvl${i === cur.li ? ' current' : ''}" data-i="${i}">
      <small>Level ${String(i + 1).padStart(2, '0')}</small><b>${lv.name}</b>
      <span class="stars">${starHtml(best[i] || 0)}</span><small>${r ? 'Best ' + r.n + ' soldiers' : 'Not cleared'}</small></button>`;
  }).join('');
  for (const el of document.querySelectorAll('.lvl')) el.onclick = () => load(+el.dataset.i);
}
$('btnLevels').onclick = () => { renderLevelList(); $('sheet').hidden = false; };
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
$('btnRetry').onclick = () => load(cur.li);
$('btnNext').onclick = () => load(cur.li + 1);
$('btnReplay').onclick = () => { if (lastRun && lastRun.li === cur.li) startReplay(lastRun.in, 'Replay'); };
$('bestBtn').onclick = () => { const r = runs[cur.li]; if (r) startReplay(r.in, `Best run · ${r.n} soldiers`); };

window.addEventListener('resize', resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
// Headless test hooks (tools/playtest.js): the simulation core only.
window.__sim = { RUNS_KEY, LEVELS, create, tick, run, starsFor, MID, W, get cur() { return cur; } };
readColors(); resize(); load(startLevel);
requestAnimationFrame(frame);
})();
</script>
